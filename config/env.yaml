# 集群资源名。2026-10-23 用只读 kubectl 逐项核对过（见 docs/plan/stage-1.md 的检查点 A）。
# 如果集群里的名字和这里不一致，先停下来问仓库所有者，不要自己改。

# 所有管理操作只允许对这个 kubeconfig context 执行，避免误操作到别的集群
kube_context: minikube

# music-streaming 仓库的本地路径。只读：恢复环境时用它的 k8s/*.yaml 作为唯一依据
music_streaming_repo: ~/music-streaming-analytics

# agent 只能看到这三个 namespace；流量发生器等基准自身的组件放在 bench_namespace
agent_visible_namespaces: [default, kafka, data]
bench_namespace: bench

deployments:
  - {name: ingestion-service, namespace: default}
  - {name: stream-processor, namespace: default}
  - {name: query-service, namespace: default}

statefulsets:
  redis: {name: redis-master, namespace: data}
  postgres: {name: postgres-postgresql, namespace: data}
  kafka: {name: kafka-controller, namespace: kafka}

kafka:
  namespace: kafka
  pod: kafka-controller-0
  container: kafka
  consumer_groups_script: /opt/bitnami/kafka/bin/kafka-consumer-groups.sh
  bootstrap_server: localhost:9092
  exec_timeout_seconds: 30

# stream-processor 是 Kafka Streams，它的 application-id 就是消费者组名
consumer_groups: [stream-processor, query-service]

secrets:
  # query-service 引用的 Secret（Secret 不能跨 namespace 引用，所以从 data 里复制一份）
  target: {namespace: default, name: postgres-credentials, key: postgres-password}
  # Helm 生成的源 Secret
  source: {namespace: data, name: postgres-postgresql, key: postgres-password}

# 流量发生器在集群内通过 Service DNS 访问业务服务（不用 port-forward，见 music-streaming ADR 007）
services:
  ingestion_url: http://ingestion-service.default.svc.cluster.local:8080
  query_url: http://query-service.default.svc.cluster.local:8082

traffic:
  name: traffic-gen
  port: 8000
  image: python:3.12-slim
  default_rate: 2
  writer_threads: 16
  cpu_limit: "2"

# 集群内的 Prometheus（第 2 阶段）。部署在独立的 namespace，agent 的 kubectl 类工具看不到它，
# 只能通过 promql_query / list_metrics 查询
monitoring:
  namespace: monitoring
  name: prometheus
  port: 9090
  image: prom/prometheus:v2.53.0
  retention: 2h

# 相对 music_streaming_repo 的路径
manifests:
  stream_processor: k8s/stream-processor.yaml
  query_service: k8s/query-service.yaml
