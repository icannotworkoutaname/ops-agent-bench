# 运行参数。模型、步数上限、超时、价格等在后面的阶段（M5/M6）再加进来；
# 这里先放健康检查需要的阈值。所有阈值都写在配置里，不写死在代码里。

# 回看窗口 W（分钟）：所有和时间有关的 agent 工具（get_events、get_pod_logs，以及之后的
# promql_query）只返回最近 W 分钟内的数据。配合下面的冷却期使用：注入前环境必须连续 W 分钟
# 保持健康，这样 agent 在窗口里能看到的，要么是健康的基线，要么是当前这次的故障，
# 不会看到上一次运行的痕迹（跨运行污染，见 docs/plan/stage-2.md 第 1 节）。
# W 越大，agent 能看到的基线越长，但每次运行前的冷却时间也越长。
lookback_minutes: 10

cooldown:
  # 冷却期内，每隔多少秒做一次完整的健康检查
  check_interval_seconds: 30
  # 等了这么久环境还没能连续健康满 W 分钟，就放弃，把这次运行标记为无效
  max_wait_minutes: 30

scenario:
  # 注入后等待症状出现的最长时间；超时就把本次运行标记为无效，而不是让 agent 开始
  verify_injected_timeout: 120
  # 恢复后等待环境重新健康的最长时间；超时视为恢复失败，整个批次应该停止
  verify_restored_timeout: 300
  # bad-kafka-bootstrap 的症状：lag 至少比注入后第一次采样多出这么多才算“在上涨”
  min_lag_growth: 30

agent:
  default_model: deepseek-flash
  # 一次运行最多发起多少次模型请求（一次请求 = 一步）
  max_steps: 25
  # 一次运行的最长时间（秒）。到点后不再发起新的请求
  max_seconds: 600
  # 一次运行累计的 token 上限 = 每步 (input + cache_read + output) 之和。
  # 上下文会随步数增长，所以累计值比单次请求大得多；这里是一个粗略的防失控保险
  max_total_tokens: 500000
  # 单次请求允许模型输出的最大 token 数。thinking 也算在里面，设太小会把回答截断
  max_output_tokens: 4096
  # 单次请求的网络超时（秒）
  request_timeout_seconds: 120
  # 模型没有调用任何工具就结束回复时，最多提醒几次“请用 submit_diagnosis 提交”
  max_nudges: 2

# 当前阶段。次数上限和预算按阶段分别统计：runs/ 里每次运行的 usage.json 会记下它属于哪个阶段
# （第 1 阶段的记录没有这个字段，按第 1 阶段算）
stage: 2

# 批量运行器
batch:
  # 开始一次运行前，要求“现在”和“现在 + 这么多分钟”都不在高峰时段：冷却期加运行本身要十几分钟，
  # 不留余量的话，一次运行可能在冷却期里就跨进了高峰
  peak_guard_minutes: 20
  # 估算整批时长用：一次运行本身（注入、agent、恢复）大约多少分钟，不含冷却期
  estimated_run_minutes: 5
  # 估算整批费用用：还没有本阶段的真实运行可参考时，假设一次运行花这么多
  fallback_cost_per_run: 0.06

# 费用与限额。标注“待填”的值必须由仓库所有者到官方定价页核对后填写；
# 只要有任何一项是 null，bench run 就拒绝发起真实运行（没有价格就没法控制预算）。
billing:
  currency: CNY # 计费币种；预算和单价都用这个币种
  # 当前阶段的累计费用上限。第 2 阶段按 stage-2.md 定为 15 元；
  # 注意：账户余额有限，余额不足时接口会报错，批次会因连续出错而停止
  budget: 15.0
  max_real_runs: 100 # 当前阶段真实 agent 运行总数上限（stage-2.md：试跑 + 正式 + 补跑 ≤ 100）
  # 高峰时段：工作日（周一到周五），UTC。官方定义是北京时间周一至周五（不含中国法定节假日）
  # 9:00-12:00、14:00-18:00，即 UTC 01:00-04:00、06:00-10:00（2026-10-23 核对官方定价页）。
  # 窗口左闭右开，按每次请求的发出时间判断。注意：这里只判断“周一到周五”，没有处理法定节假日。
  peak:
    weekdays_only: true
    windows_utc: [["01:00", "04:00"], ["06:00", "10:00"]]

# 模型条目。第 1 阶段只用 deepseek-flash；deepseek-v4-pro 留到第 4 阶段对比。
# pricing 的单位是“每百万 token”，分高峰 / 非高峰，每档分缓存命中输入 / 未命中输入 / 输出。
models:
  deepseek-flash:
    model: deepseek-flash
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY
    pricing: # 元 / 百万 token；官方定价页 2026-10-23，经仓库所有者确认。官方称空闲时段是高峰的一半
      peak: {input_cache_miss: 2.0, input_cache_hit: 0.04, output: 8.0}
      offpeak: {input_cache_miss: 1.0, input_cache_hit: 0.02, output: 4.0}
  deepseek-v4-pro:
    model: deepseek-v4-pro
    base_url: https://api.deepseek.com/anthropic
    api_key_env: DEEPSEEK_API_KEY
    pricing: # 待填（第 4 阶段才用）
      peak: {input_cache_miss: null, input_cache_hit: null, output: null}
      offpeak: {input_cache_miss: null, input_cache_hit: null, output: null}

tools:
  # 单个工具返回给模型的最大字符数，超出会被截断并注明原长度
  max_output_chars: 6000
  default_log_tail_lines: 100
  # get_pod_logs 的 tail 上限，模型要求更大的值也只给这么多
  max_log_tail_lines: 300
  max_events: 30
  # Prometheus 工具的结果上限：超出时只显示一部分，并在结果里写明省略了多少
  prom_max_series: 20
  prom_max_points: 60
  prom_max_metrics: 100

# 各场景的可调参数。数字都是实测后定的，改动前先用 `bench stability <场景>` 重新验证
scenario_params:
  sp-pod-killed:
    # 症状确认：stream-processor 没有 Ready 的 Pod，且 lag 比第一次采样多出这么多
    min_lag_growth: 10
  sp-cpu-throttle:
    cpu_limit: 100m
    cpu_request: 50m
    # 每秒事件数。实测 stream-processor 在 300/s 时才用到 0.13 核，所以 100/s 下 100m 的限制
    # 不会让它跟不上；400/s 时它需要约 0.16 核，会被限流
    traffic_rate: 400
    min_lag_growth: 200
    # 症状还要求 cAdvisor 里 stream-processor 的 CPU 限流比例不低于这个值：注入时先把它停掉了，
    # 单靠 lag 上涨分不清是“限流”还是“单纯停机”
    min_throttle_ratio: 0.5
  sp-oom:
    memory_limit: 128Mi
  postgres-down:
    min_lag_growth: 5
  query-probe-misconfig:
    bad_path: /actuator/healthz
    # Pod 的容器已经起来这么多秒仍然不 Ready，才算“探针配置错了”而不是“还在启动”
    min_running_seconds: 60
  ingestion-overload:
    traffic_rate: 600
    min_cpu_cores: 0.4 # ingestion-service 的 CPU limit 是 0.5 核

health:
  # 消费者组 lag（所有分区求和）低于这个值才算健康。
  # 先给一个宽松的初值，等观察过干净环境下带流量的基线后再收紧（见 stage-1.md）。
  max_consumer_lag: 50
  # 只统计流量发生器最近这么多秒的结果。窗口越短，恢复后越快变回健康
  traffic_window_seconds: 20
  # 这个窗口内至少要有这么多次成功的写入 / 查询，才能证明链路真的在工作
  min_write_ok: 5
  min_query_ok: 2
  # 窗口内允许的失败次数
  max_write_fail: 0
  max_query_fail: 0
  # 控制面（controller-manager / apiserver）最近这么多秒的日志里，认证错误（Unauthorized、
  # token 过期）不能超过这个条数。用来发现“机器休眠后 token 过期”这类不会让 Pod 变 NotReady、
  # 但会以事件形式污染 agent 所见内容的问题
  control_plane_window_seconds: 300
  max_control_plane_auth_errors: 0
