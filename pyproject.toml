[project]
name = "ops-agent-bench"
version = "0.1.0"
description = "在 music-streaming 上注入已知故障，评估 LLM agent 的诊断能力"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "mcp",
    "kubernetes",
    "httpx",
    "pyyaml",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
bench = "bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 集成测试需要真实集群，默认不跑；用 `pytest -m integration` 显式开启
addopts = "-m 'not integration'"
markers = [
    "integration: 需要 minikube 集群的集成测试",
]

[tool.ruff]
line-length = 100
