# 集群内的 Prometheus。__XXX__ 占位符由 bench/monitoring/__init__.py 用 config/env.yaml 的值替换。
#
# 范围（见 docs/adr 里关于 Prometheus 范围的那份）：
#   抓：业务服务的 /actuator/prometheus（Pod 级服务发现）、kubelet 的 cAdvisor（容器 CPU / 内存 / 限流）
#   不抓：bench namespace 里的流量发生器——它的成功 / 失败计数相当于“用户侧看到的症状”，
#         只给注入器和健康检查用，不能让 agent 查到。
# 数据只保留很短一段时间，而且存在 emptyDir 里，重启就清空；这是评测用的临时设施。
apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: __NAME__
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: __NAME__
rules:
  # 服务发现要 list / watch pods 和 nodes；抓 cAdvisor 要通过 API server 代理 nodes/proxy
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: __NAME__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: __NAME__
subjects:
  - kind: ServiceAccount
    name: __NAME__
    namespace: __NAMESPACE__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: __NAME__-config
  namespace: __NAMESPACE__
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    scrape_configs:
      # 三个业务服务。用 Pod 级服务发现而不是经过 Service，多副本时每个 Pod 都能被抓到
      - job_name: apps
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [__APP_NAMESPACE__]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: ingestion-service|stream-processor|query-service
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_container_port_number]
            separator: ":"
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
      # kubelet 的 cAdvisor：容器 CPU、内存、CPU 限流。通过 API server 代理访问
      - job_name: cadvisor
        scheme: https
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
        metric_relabel_configs:
          # 只保留 agent 可见的三个 namespace；bench、monitoring、kube-system 的容器一律丢弃
          - source_labels: [namespace]
            regex: __VISIBLE_NAMESPACES__
            action: keep
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __NAME__
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app: __NAME__
  template:
    metadata:
      labels:
        app: __NAME__
    spec:
      serviceAccountName: __NAME__
      containers:
        - name: __NAME__
          image: __IMAGE__
          # 镜像预先放进 minikube 节点；Docker Hub 不稳定，不依赖每次现拉
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=__RETENTION__
            - --web.listen-address=:__PORT__
          ports:
            - containerPort: __PORT__
          readinessProbe:
            httpGet:
              path: /-/ready
              port: __PORT__
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: config
          configMap:
            name: __NAME__-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: __NAME__
  namespace: __NAMESPACE__
spec:
  selector:
    app: __NAME__
  ports:
    - port: __PORT__
      targetPort: __PORT__
